<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" width="720" height="256">
  <defs>
    <linearGradient id="badgeGradU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2547"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glowGradU" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E676" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensGradU" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ======== MARK: glowing signal in dark badge ======== -->
  <g id="mark">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#badgeGradU)" stroke="#2A3A5F" stroke-width="2"/>
    <circle cx="128" cy="160" r="46" fill="url(#glowGradU)"/>
    <rect x="120" y="198" width="16" height="30" rx="8" fill="#1E293B"/>
    <rect x="96" y="34" width="64" height="168" rx="32" fill="#070C18" stroke="#3B4A6B" stroke-width="2"/>
    <circle cx="128" cy="74" r="15" fill="#F87171" opacity="0.16"/>
    <circle cx="128" cy="117" r="15" fill="#FBBF24" opacity="0.16"/>
    <circle cx="128" cy="160" r="27" fill="none" stroke="#00E676" stroke-width="2" opacity="0.45"/>
    <circle cx="128" cy="160" r="37" fill="none" stroke="#00E676" stroke-width="1.5" opacity="0.2"/>
    <circle cx="128" cy="160" r="15" fill="#00E676"/>
    <circle cx="128" cy="160" r="15" fill="url(#lensGradU)"/>
  </g>

  <!-- divider -->
  <line x1="282" y1="52" x2="282" y2="204" stroke="#2A3A5F" stroke-width="2"/>

  <!-- ======== WORDMARK: URDU ======== -->
  <text x="500" y="165" font-family="'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Urdu Typesetting',serif" font-size="130" font-weight="700" fill="#00E676" text-anchor="middle">&#1587;&#1576;&#1586;</text>
</svg>
