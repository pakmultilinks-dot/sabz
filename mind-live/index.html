const GREEN = [0, 230, 118];
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- playback state ---------- */
const NFR = DATA.frames.length;          // 56 data frames
const FPS = 30;                          // playback fps
const STEP = FPS;                        // rendered frames per data frame
const TOTAL = (NFR - 1) * STEP;          // 1650 rendered frames
let play = { t: 0, speed: 1, playing: true };
let scrubbing = false;

/* ---------- layout (recomputed on resize) ---------- */
const L = {};                            // neuron positions
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const headH = 92, footH = 158;
  const y0 = headH + 8, y1 = H - footH - 8, nh = y1 - y0, cy = (y0 + y1) / 2;
  L.y0 = y0; L.y1 = y1; L.nh = nh; L.cy = cy; L.headH = headH;

  const xi = W * 0.205, x1 = W * 0.435, x2 = W * 0.635, xo = W * 0.855;
  L.xi = xi; L.x1 = x1; L.x2 = x2; L.xo = xo;

  // input: 18 rows
  L.inp = [];
  for (let i = 0; i < 18; i++)
    L.inp.push({ x: xi, y: y0 + nh * (i + 0.5) / 18, r: 8 });

  // hidden grids 8x8
  const gw = Math.min(W * 0.135, nh * 0.62);
  const cell = gw / 8;
  L.cell = cell; L.gr = cell * 0.30;
  L.h1 = []; L.h2 = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    L.h1.push({ x: x1 - gw / 2 + cell * (c + 0.5), y: cy - gw / 2 + cell * (r + 0.5) });
    L.h2.push({ x: x2 - gw / 2 + cell * (c + 0.5), y: cy - gw / 2 + cell * (r + 0.5) });
  }
  // output orbs
  L.out = [
    { x: xo, y: cy - nh * 0.17, r: 40, name: 'HOLD', idx: 0 },
    { x: xo, y: cy + nh * 0.17, r: 40, name: 'SWITCH', idx: 1 },
  ];
  L.xi2 = xi; buildWeb();
}

/* ---------- static connection web (weights never change) ---------- */
let web = null;
function buildWeb() {
  web = document.createElement('canvas');
  web.width = W * DPR; web.height = H * DPR;
  const g = web.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ws = DATA.weights;   // {w1:[1152], w2:[4096], w3:[128], m1,m2,m3}
  function stroke(a) { return 'rgba(0,230,118,' + a.toFixed(3) + ')'; }

  g.lineWidth = 1;
  // input -> h1 (18 x 64)
  for (let i = 0; i < 18; i++) for (let j = 0; j < 64; j++) {
    const w = ws.w1[i * 64 + j];
    const a = Math.min(0.16, Math.abs(w) / ws.m1 * 0.16);
    if (a < 0.008) continue;
    g.strokeStyle = stroke(a);
    g.beginPath(); g.moveTo(L.inp[i].x, L.inp[i].y);
    g.lineTo(L.h1[j].x, L.h1[j].y); g.stroke();
  }
  // h1 -> h2 (64 x 64), skip the weakest for elegance
  for (let i = 0; i < 64; i++) for (let j = 0; j < 64; j++) {
    const w = ws.w2[i * 64 + j];
    const a = Math.min(0.10, Math.abs(w) / ws.m2 * 0.10);
    if (a < 0.012) continue;
    g.strokeStyle = stroke(a);
    g.beginPath(); g.moveTo(L.h1[i].x, L.h1[i].y);
    g.lineTo(L.h2[j].x, L.h2[j].y); g.stroke();
  }
  // h2 -> output (64 x 2)
  for (let i = 0; i < 64; i++) for (let j = 0; j < 2; j++) {
    const w = ws.w3[i * 2 + j];
    const a = Math.min(0.35, Math.abs(w) / ws.m3 * 0.35);
    if (a < 0.02) continue;
    g.strokeStyle = stroke(a);
    g.beginPath(); g.moveTo(L.h2[i].x, L.h2[i].y);
    g.lineTo(L.out[j].x, L.out[j].y); g.stroke();
  }
}

/* ---------- signal pulses ---------- */
const pulses = [];
function spawnPulses(fA, fB, wKey, mKey, srcArr, dstArr, n) {
  const ws = DATA.weights;
  for (let k = 0; k < n; k++) {
    // source weighted by activation
    let r = Math.random() * (fA.sum + 1e-6), si = 0;
    for (; si < fA.arr.length - 1; si++) { r -= fA.arr[si]; if (r <= 0) break; }
    // destination weighted by |weight|
    const base = si * dstArr.length;
    let tot = 0;
    for (let j = 0; j < dstArr.length; j++) tot += Math.abs(ws[wKey][base + j]);
    let r2 = Math.random() * (tot + 1e-6), dj = 0;
    for (; dj < dstArr.length - 1; dj++) { r2 -= Math.abs(ws[wKey][base + dj]); if (r2 <= 0) break; }
    pulses.push({
      sx: srcArr[si].x, sy: srcArr[si].y,
      dx: dstArr[dj].x, dy: dstArr[dj].y,
      t: 0, sp: 0.05 + Math.random() * 0.06,
      b: Math.min(1, fA.arr[si] * 2),
    });
  }
}
function drawPulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.sp;
    if (p.t >= 1) { pulses.splice(i, 1); continue; }
    const x = p.sx + (p.dx - p.sx) * p.t, y = p.sy + (p.dy - p.sy) * p.t;
    const a = Math.sin(p.t * Math.PI) * p.b;
    if (a <= 0.01) continue;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, 7);
    gr.addColorStop(0, 'rgba(160,255,200,' + (0.9 * a).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(0,230,118,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
  }
}

  ctx.fillStyle = '#9fb3c8';
  for (const p of parts) {
    p.y -= p.v; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
    ctx.globalAlpha = p.a;
    ctx.fillRect(p.x * W, p.y * H, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

/* ---------- neuron orb ---------- */
function orb(x, y, r, b, core) {
  b = Math.max(0, Math.min(1, b));
  if (b < 0.02) {
    ctx.strokeStyle = 'rgba(120,135,155,0.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
    return;
  }
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r * (1 + b * 1.6));
  const R = core || GREEN;
  gr.addColorStop(0, 'rgba(255,255,255,' + (0.55 + 0.45 * b).toFixed(3) + ')');
  gr.addColorStop(0.25, 'rgba(' + R[0] + ',' + R[1] + ',' + R[2] + ',' + (0.75 * b + 0.15).toFixed(3) + ')');
  gr.addColorStop(1, 'rgba(' + R[0] + ',' + R[1] + ',' + R[2] + ',0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(x, y, r * (1 + b * 1.6), 0, 7); ctx.fill();
}

/* ---------- data interpolation ---------- */
const meta = DATA.meta, scale = DATA.scale, FR = DATA.frames;
function sample(t) {
  const f = Math.min(t / STEP, NFR - 1.001);
  const i0 = Math.floor(f), k = f - i0;
  const A = FR[i0], B = FR[i0 + 1];
  const mix = (a, b) => a.map((v, i) => v + (b[i] - v) * k);
  return {
    s: mix(A.s, B.s), a1: mix(A.a1, B.a1), a2: mix(A.a2, B.a2),
    q: mix(A.q, B.q),
    decision: k < 0.5 ? A.decision : B.decision,
    A: A, B: B, k: k, i0: i0,
  };
}

/* ---------- switch flash ---------- */
let flash = 0, flashX = 0, flashY = 0;
let lastDec = -1;

/* ---------- header ---------- */
function drawHeader(t) {
  const f = FR[Math.min(Math.floor(t / STEP), NFR - 1)];
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#e8ecf1';
  ctx.font = '700 30px "Space Grotesk"';
  ctx.fillText('INSIDE THE MIND OF SABZ', 34, 44);
  ctx.font = '500 12px "Space Grotesk"';
  ctx.fillStyle = '#00E676';
  ctx.fillText('TRAINED DQN  ·  5,506 PARAMETERS  ·  LIVE INFERENCE', 36, 66);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#8b93a3'; ctx.font = '500 12px "Space Grotesk"';
  const scen = f.t < 30 ? 'SCENARIO · NS RUSH HOUR' : 'SCENARIO · EW RUSH HOUR';
  ctx.fillText(scen, W - 36, 40);
  ctx.fillStyle = '#e8ecf1'; ctx.font = '700 22px "Space Grotesk"';
  ctx.fillText('t = ' + f.t.toFixed(1) + 's', W - 36, 66);
  ctx.textAlign = 'left';
  ctx.strokeStyle = 'rgba(0,230,118,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 88); ctx.lineTo(W, 88); ctx.stroke();
}

/* ---------- network ---------- */
function drawNet(smp) {
  const cy = L.cy;
  // layer captions
  ctx.font = '600 11px "Space Grotesk"'; ctx.fillStyle = '#5b6373';
  ctx.textAlign = 'center';
  ctx.fillText('INPUT · 18 SIGNALS', L.xi, L.y0 - 16);
  ctx.fillText('HIDDEN 1 · 64', L.x1, L.y0 - 16);
  ctx.fillText('HIDDEN 2 · 64', L.x2, L.y0 - 16);
  ctx.fillText('OUTPUT · Q-VALUES', L.xo, L.y0 - 16);
  ctx.textAlign = 'left';

  // static web
  ctx.drawImage(web, 0, 0, W, H);

  // input neurons + labels
  ctx.font = '500 10.5px "Space Grotesk"';
  for (let i = 0; i < 18; i++) {
    const n = L.inp[i], v = Math.min(1, Math.abs(smp.s[i]));
    ctx.fillStyle = v > 0.02 ? 'rgba(200,255,220,0.85)' : '#454c5c';
    ctx.textAlign = 'right';
    ctx.fillText(meta.input_labels[i], n.x - 16, n.y + 3.5);
    ctx.textAlign = 'left';
    orb(n.x, n.y, n.r, v);
  }

  // hidden layers
  for (let j = 0; j < 64; j++) {
    orb(L.h1[j].x, L.h1[j].y, L.gr, smp.a1[j] / scale.a1);
    orb(L.h2[j].x, L.h2[j].y, L.gr, smp.a2[j] / scale.a2);
  }

  // output orbs
  const q = smp.q, win = q[0] >= q[1] ? 0 : 1;
  const qn = q.map(v => {
    const rng = scale.q_pos - scale.q_neg || 1;
    return (v - scale.q_neg) / rng;
  });
  for (let j = 0; j < 2; j++) {
    const o = L.out[j], b = Math.min(1, Math.max(0.05, qn[j]));
    if (j === win) {
      ctx.strokeStyle = 'rgba(0,230,118,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 10 + Math.sin(performance.now() / 300) * 3, 0, 7); ctx.stroke();
    }
    orb(o.x, o.y, o.r, 0.25 + b * 0.75);
    ctx.textAlign = 'center';
    ctx.fillStyle = j === win ? '#00E676' : '#7c8494';
    ctx.font = '700 15px "Space Grotesk"';
    ctx.fillText(o.name, o.x, o.y - o.r - 12);
    ctx.fillStyle = '#e8ecf1'; ctx.font = '600 13px "Space Grotesk"';
    ctx.fillText('Q ' + q[j].toFixed(2), o.x, o.y + o.r + 22);
    ctx.textAlign = 'left';
  }

  // pulses: spawn from current activations
  if (play.playing && !scrubbing) {
    const sum1 = smp.a1.reduce((a, b) => a + b, 0);
    const sumS = smp.s.reduce((a, b) => a + Math.abs(b), 0);
    if (pulses.length < 130) {
      spawnPulses({ arr: smp.s.map(Math.abs), sum: sumS }, L.inp, 'w1', 'm1', L.inp, L.h1, 3);
      spawnPulses({ arr: smp.a1, sum: sum1 }, L.h1, 'w2', 'm2', L.h1, L.h2, 4);
      const sum2 = smp.a2.reduce((a, b) => a + b, 0);
      spawnPulses({ arr: smp.a2, sum: sum2 }, L.h2, 'w3', 'm3', L.h2, L.out, 2);
    }
  }
  drawPulses();

  // switch flash
  if (flash > 0) {
    flash -= 0.03;
    const fr = (1 - flash) * Math.max(W, H) * 0.5;
    ctx.strokeStyle = 'rgba(0,230,118,' + (flash * 0.8).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(flashX, flashY, fr, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(0,230,118,' + (flash * 0.06).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- footer: traffic + decision + timeline ---------- */
function drawFooter(smp) {
  const y = H - 158;
  ctx.strokeStyle = 'rgba(0,230,118,0.25)';
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();

  const f = smp.k < 0.5 ? smp.A : smp.B;
  const qd = f.queue;
  // approach tiles
  const tiles = ['N', 'S', 'E', 'W'];
  const tw = 200, tx0 = 40;
  ctx.font = '600 11px "Space Grotesk"';
  tiles.forEach((a, i) => {
    const x = tx0 + i * (tw + 14);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(x, y + 16, tw, 62);
    ctx.fillStyle = '#5b6373';
    ctx.fillText('APPROACH ' + a, x + 12, y + 34);
    ctx.fillStyle = '#e8ecf1'; ctx.font = '700 24px "Space Grotesk"';
    ctx.fillText(qd[a] + ' queued', x + 12, y + 62);
    ctx.font = '600 11px "Space Grotesk"';
    const bw = Math.min(1, qd[a] / 12) * (tw - 24);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x + 12, y + 70, tw - 24, 4);
    ctx.fillStyle = '#00E676';
    ctx.fillRect(x + 12, y + 70, bw, 4);
  });

  // decision readout
  const dx = tx0 + 4 * (tw + 14) + 30;
  const dec = smp.decision;
  ctx.font = '600 11px "Space Grotesk"'; ctx.fillStyle = '#5b6373';
  ctx.fillText('BRAIN DECISION', dx, y + 30);
  ctx.font = '700 44px "Space Grotesk"';
  ctx.fillStyle = dec === 1 ? '#00E676' : '#e8ecf1';
  ctx.fillText(dec === 1 ? 'SWITCH' : 'HOLD', dx, y + 72);
  ctx.font = '500 12px "Space Grotesk"'; ctx.fillStyle = '#8b93a3';
  ctx.fillText('PHASE ' + f.phase + ' GREEN  ·  ' + f.green_elapsed.toFixed(0) + 's elapsed',
    dx, y + 96);
  ctx.fillText('served ' + f.served + '  ·  avg delay ' + f.avg_delay + 's',
    dx, y + 114);

  // timeline
  const tly = H - 26, tlx0 = 40, tlx1 = W - 220;
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(tlx0, tly - 2, tlx1 - tlx0, 4);
  // switch ticks
  ctx.fillStyle = '#00E676';
  FR.forEach((fr, i) => {
    if (fr.decision === 1) {
      const x = tlx0 + (i / (NFR - 1)) * (tlx1 - tlx0);
      ctx.fillRect(x - 1, tly - 7, 2, 14);
    }
  });
  const px = tlx0 + (play.t / TOTAL) * (tlx1 - tlx0);
  ctx.fillStyle = '#00E676';
  ctx.beginPath(); ctx.arc(px, tly, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(px, tly, 3, 0, 7); ctx.fill();

  // controls
  ctx.font = '600 12px "Space Grotesk"'; ctx.fillStyle = '#8b93a3';
  const cstr = (play.playing ? '❚❚ PAUSE' : '▶ PLAY') + '    1×/2×: ' +
    play.speed + '×    R: RESTART';
  ctx.fillText(cstr, tlx1 + 20, tly + 4);

  // decision change -> flash + event
  if (dec !== lastDec) {
    if (lastDec !== -1 && dec === 1) {
      flash = 1; flashX = L.out[1].x; flashY = L.out[1].y;
    }
    lastDec = dec;
  }
}

/* ---------- main loop ---------- */
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  if (play.playing && !scrubbing) {
    play.t += dt * FPS * play.speed;
    if (play.t >= TOTAL) play.t = 0;
  }
  drawBG();
  const smp = sample(play.t);
  drawNet(smp);
  drawHeader(play.t);
  drawFooter(smp);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { play.playing = !play.playing; e.preventDefault(); }
  if (e.key === 'r' || e.key === 'R') play.t = 0;
  if (e.key === '1') play.speed = 1;
  if (e.key === '2') play.speed = 2;
});
cv.addEventListener('pointerdown', e => {
  const tly = H - 26;
  if (Math.abs(e.clientY - tly) < 30) {
    scrubbing = true; scrubTo(e.clientX);
  }
});
window.addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
window.addEventListener('pointerup', () => scrubbing = false);
function scrubTo(x) {
  const tlx0 = 40, tlx1 = W - 220;
  play.t = Math.max(0, Math.min(1, (x - tlx0) / (tlx1 - tlx0))) * TOTAL;
}
window.addEventListener('resize', layout);
setTimeout(() => document.getElementById('hint').style.opacity = 0, 6000);

layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
