<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABZ 3D - AI Traffic Control</title>
<script src="three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0a0e14; color:#e6e6e6; overflow:hidden; }
  #c { position:fixed; inset:0; }
  #hud { position:fixed; top:16px; left:16px; background:rgba(10,14,20,.82); border:1px solid #1e3a2f;
         border-radius:12px; padding:14px 18px; backdrop-filter:blur(8px); max-width:320px; }
  #hud h1 { font-size:20px; color:#4ade80; letter-spacing:2px; margin-bottom:4px; }
  #hud p { font-size:12px; color:#9ca3af; margin-bottom:10px; }
  .stat { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-bottom:1px solid #1a1a1a; }
  .stat b { color:#4ade80; }
  #ctrl { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
  #ctrl button { background:#14532d; color:#fff; border:1px solid #22c55e; border-radius:8px;
                 padding:10px 18px; font-size:14px; cursor:pointer; }
  #ctrl button:hover { background:#166534; }
  #ctrl button.on { background:#22c55e; color:#052e16; font-weight:700; }
  #brain { position:fixed; top:16px; right:16px; background:rgba(10,14,20,.82); border:1px solid #1e3a2f;
           border-radius:12px; padding:14px 18px; max-width:280px; backdrop-filter:blur(8px); }
  #brain h2 { font-size:14px; color:#4ade80; margin-bottom:8px; letter-spacing:1px; }
  #brainlog { font-size:12px; color:#d1d5db; max-height:180px; overflow-y:auto; }
  #brainlog div { padding:3px 0; border-bottom:1px solid #1a1a1a; }
  .tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; margin-right:6px; }
  .tag.safe { background:#14532d; color:#86efac; }
  .tag.ai { background:#1e3a8a; color:#bfdbfe; }
</style>
</head>
<body>
<div id="c"></div>
<div id="hud">
  <h1>SABZ 3D</h1>
  <p>AI-adaptive traffic signal &mdash; live neural control</p>
  <div class="stat"><span>Avg delay / vehicle</span><b id="sDelay">-</b></div>
  <div class="stat"><span>Vehicles served</span><b id="sServed">-</b></div>
  <div class="stat"><span>Waiting now</span><b id="sWait">-</b></div>
  <div class="stat"><span>Safety holds</span><b id="sSafe">-</b></div>
  <div class="stat"><span>Signal phase</span><b id="sPhase">-</b></div>
</div>
<div id="brain">
  <h2>BRAIN ACTIVITY</h2>
  <div id="brainlog"></div>
</div>
<div id="ctrl">
  <button id="bCam" class="on">Cinematic cam</button>
  <button id="bRush">Rush hour</button>
  <button id="bCalm">Calm</button>
</div>
<script>
"use strict";
/* ============ SABZ 3D demo: Three.js intersection, AI-controlled ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.Fog(0x0a0e14, 60, 160);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('c').appendChild(renderer.domElement);

/* lights */
scene.add(new THREE.AmbientLight(0x8899bb, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.9);
sun.position.set(30, 50, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45;
scene.add(sun);
const night = new THREE.PointLight(0x88aaff, 0.0, 120);
night.position.set(0, 25, 0); scene.add(night);

/* ground */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220,220),
  new THREE.MeshStandardMaterial({color:0x11151c, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

/* roads */
const roadMat = new THREE.MeshStandardMaterial({color:0x23262b, roughness:0.9});
const lineMat = new THREE.MeshBasicMaterial({color:0xd8d8d8});
function road(w,l,x,z,rot){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,l), roadMat);
  m.rotation.x=-Math.PI/2; m.rotation.z=rot||0; m.position.set(x,0.02,z);
  m.receiveShadow=true; scene.add(m);
}
road(14,220,0,0); road(220,14,0,0);
/* lane dashes */
for(let i=-100;i<100;i+=6){
  if(Math.abs(i)<10) continue;
  for(const s of [-3.5,3.5]){
    const d=new THREE.Mesh(new THREE.PlaneGeometry(0.35,2.4), lineMat);
    d.rotation.x=-Math.PI/2; d.position.set(s,0.04,i); scene.add(d);
    const d2=d.clone(); d2.rotation.z=Math.PI/2; d2.position.set(i,0.04,s); scene.add(d2);
  }
}
/* stop lines */
for(const [x,z,rot] of [[-8.2,0,0],[8.2,0,0],[0,-8.2,Math.PI/2],[0,8.2,Math.PI/2]]){
  const s=new THREE.Mesh(new THREE.PlaneGeometry(5.6,0.7), new THREE.MeshBasicMaterial({color:0xffffff}));
  s.rotation.x=-Math.PI/2; s.rotation.z=rot; s.position.set(x,0.04,z); scene.add(s);
}
/* sidewalks + buildings */
const walkMat=new THREE.MeshStandardMaterial({color:0x2b2f36, roughness:1});
for(const [x,z,w,d] of [[-14,0,10,220],[14,0,10,220],[0,-14,220,10],[0,14,220,10]]){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.5,d), walkMat);
  m.position.set(x,0.25,z); m.receiveShadow=true; scene.add(m);
}
const bColors=[0x1c2330,0x232b3a,0x1a2230,0x252d3d];
let bi=0;
for(let gx=-3;gx<=3;gx++) for(let gz=-3;gz<=3;gz++){
  if(Math.abs(gx)<1.4&&Math.abs(gz)<1.4) continue;
  if((gx+gz)%2===0) continue;
  const h=6+((gx*7+gz*13)%3+3)%3*5;
  const b=new THREE.Mesh(new THREE.BoxGeometry(13,h,13),
    new THREE.MeshStandardMaterial({color:bColors[bi++%4], roughness:0.85}));
  b.position.set(gx*26, h/2+0.5, gz*26); b.castShadow=true; b.receiveShadow=true; scene.add(b);
  /* lit windows */
  const wg=new THREE.PlaneGeometry(11,h*0.7);
  const wm=new THREE.MeshBasicMaterial({color:0xffd76a, transparent:true, opacity:0.16});
  for(const [rx,rz,ry] of [[0,6.55,0],[0,-6.55,Math.PI],[6.55,0,Math.PI/2],[-6.55,0,-Math.PI/2]]){
    const w=new THREE.Mesh(wg,wm); w.position.set(gx*26+rx, h/2+0.5, gz*26+rz); w.rotation.y=ry; scene.add(w);
  }
}
/* street lamps */
const lampMat=new THREE.MeshStandardMaterial({color:0x39424e, roughness:0.6});
for(const [x,z] of [[-11,-11],[11,11],[-11,11],[11,-11],[-11,-40],[11,40]]){
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.24,9,8), lampMat);
  p.position.set(x,4.5,z); p.castShadow=true; scene.add(p);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.5,10,10),
    new THREE.MeshBasicMaterial({color:0xffe9a8}));
  bulb.position.set(x,9.1,z); scene.add(bulb);
  const pl=new THREE.PointLight(0xffd98a, 0.7, 26); pl.position.set(x,8.6,z); scene.add(pl);
}

/* ---- traffic light poles ---- */
const sigHeads={};
function signalPole(x,z,ry){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,7,10), lampMat);
  pole.position.y=3.5; pole.castShadow=true; g.add(pole);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.25,4.4), lampMat);
  arm.position.set(0,6.6,2.0); g.add(arm);
  const box=new THREE.Mesh(new THREE.BoxGeometry(1.1,2.6,0.9),
    new THREE.MeshStandardMaterial({color:0x14171c, roughness:0.5}));
  box.position.set(0,5.4,4.0); g.add(box);
  const mk=(dy,c)=>{
    const l=new THREE.Mesh(new THREE.SphereGeometry(0.32,12,12),
      new THREE.MeshBasicMaterial({color:0x222222}));
    l.position.set(0,5.4+dy,4.48); g.add(l); return l;
  };
  const head={r:mk(0.8,0xff2222), y:mk(0,0xffbb22), g:mk(-0.8,0x22ff55)};
  g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
  return head;
}
sigHeads.N=signalPole(9.5,-9.5,Math.PI); sigHeads.S=signalPole(-9.5,9.5,0);
sigHeads.E=signalPole(-9.5,-9.5,-Math.PI/2); sigHeads.W=signalPole(9.5,9.5,Math.PI/2);
function setSig(phase, trans){
  const on=(h,c)=>h.material.color.setHex(c), off=h=>h.material.color.setHex(0x222222);
  for(const k of ['N','S','E','W']){ off(sigHeads[k].r); off(sigHeads[k].y); off(sigHeads[k].g); }
  const green = phase==='NS'?['N','S']:['E','W'];
  const red = phase==='NS'?['E','W']:['N','S'];
  if(trans){ green.forEach(k=>on(sigHeads[k].y,0xffbb22)); }
  else { green.forEach(k=>on(sigHeads[k].g,0x22ff55)); }
  red.forEach(k=>on(sigHeads[k].r,0xff2222));
}

/* ---- cars ---- */
const carColors=[0xd64545,0x4a7dd6,0xe8e8e8,0x2b2b2b,0xe8a13c,0x45b36a,0x9a5fd6];
const cars=[];
function makeCar(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.85,4.2),
    new THREE.MeshStandardMaterial({color, roughness:0.35, metalness:0.5}));
  body.position.y=0.85; body.castShadow=true; g.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.7,2.0),
    new THREE.MeshStandardMaterial({color:0x10141a, roughness:0.2, metalness:0.6}));
  cab.position.set(0,1.5,-0.2); cab.castShadow=true; g.add(cab);
  const wg=new THREE.CylinderGeometry(0.42,0.42,0.35,12);
  const wm=new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.9});
  for(const [x,z] of [[-1.0,1.4],[1.0,1.4],[-1.0,-1.4],[1.0,-1.4]]){
    const w=new THREE.Mesh(wg,wm); w.rotation.z=Math.PI/2; w.position.set(x,0.42,z); g.add(w);
  }
  const hl=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.25,0.1),
    new THREE.MeshBasicMaterial({color:0xfff6c9}));
  hl.position.set(0,0.95,2.12); g.add(hl);
  const tl=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.25,0.1),
    new THREE.MeshBasicMaterial({color:0xff3333}));
  tl.position.set(0,0.95,-2.12); g.add(tl);
  return g;
}
/* traffic state (mirrors the 2D sim logic, simplified) */
const APPR={N:{x:3.5,z:-100,dx:0,dz:1,ry:0},S:{x:-3.5,z:100,dx:0,dz:-1,ry:Math.PI},
            E:{x:-100,z:-3.5,dx:1,dz:0,ry:-Math.PI/2},W:{x:100,z:3.5,dx:-1,dz:0,ry:Math.PI/2}};
let phase='NS', gEl=0, trans=0, simT=0, served=0, delaySum=0, waitNow=0, holds=0;
let spawnAcc={N:0,S:0,E:0,W:0}, rate=0.16, brainLog=[];
function spawn(a){
  const A=APPR[a];
  const c=makeCar(carColors[(Math.random()*carColors.length)|0]);
  c.position.set(A.x+(Math.random()-0.5)*1.2, 0, A.z);
  c.rotation.y=A.ry; scene.add(c);
  cars.push({m:c,a,dist:100,speed:11+Math.random()*3,wait:0,q:false});
}
function logBrain(html){ const el=document.getElementById('brainlog');
  const d=document.createElement('div'); d.innerHTML=html;
  el.prepend(d); while(el.children.length>14) el.lastChild.remove(); }

let camMode=0, camT=0;
document.getElementById('bCam').onclick=e=>{camMode=(camMode+1)%3;
  e.target.textContent=['Cinematic cam','Top cam','Driver cam'][camMode];
  e.target.classList.add('on');};
document.getElementById('bRush').onclick=e=>{rate=0.30;e.target.classList.add('on');
  document.getElementById('bCalm').classList.remove('on');};
document.getElementById('bCalm').onclick=e=>{rate=0.07;e.target.classList.add('on');
  document.getElementById('bRush').classList.remove('on');};

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.25); simT+=dt;
  /* spawn */
  for(const a in APPR){ spawnAcc[a]+=rate*dt*(a==='N'||a==='S'?1.4:0.6);
    if(spawnAcc[a]>1){spawnAcc[a]-=1; if(cars.length<70) spawn(a);} }
  /* move */
  waitNow=0;
  const greenAppr = trans>0?[]:(phase==='NS'?['N','S']:['E','W']);
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i], A=APPR[c.a];
    const stopD = 9.5;
    const ahead = cars.find(o=>o!==c&&o.a===c.a&&o.dist<c.dist&&(c.dist-o.dist)<7);
    let v=c.speed;
    if(ahead) v=Math.min(v, Math.max(0,(c.dist-ahead.dist-6)*2));
    if(!greenAppr.includes(c.a) && c.dist<stopD+14 && c.dist>stopD-1) v=0;
    if(greenAppr.includes(c.a) && c.dist<stopD+2 && c.dist>stopD-3 && Math.random()<0.02) v=0;
    c.dist-=v*dt;
    c.m.position.x+=A.dx*v*dt; c.m.position.z+=A.dz*v*dt;
    if(v<0.5){ c.wait+=dt; waitNow++; } 
    if(c.dist<-8){ scene.remove(c.m); cars.splice(i,1); served++;
      delaySum+=c.wait; }
  }
  /* AI decide (actuated brain logic) */
  gEl+=dt;
  if(trans>0){ trans-=dt; if(trans<=0){ phase=phase==='NS'?'EW':'NS'; gEl=0;
    logBrain('<span class="tag ai">AI</span>Phase → '+phase); } }
  else {
    const q=a=>cars.filter(c=>c.a===a&&c.wait>0.5).length;
    const cur=phase==='NS'?q('N')+q('S'):q('E')+q('W');
    const oth=phase==='NS'?q('E')+q('W'):q('N')+q('S');
    const dizzy=cars.some(c=>greenAppr.includes(c.a)&&c.dist<70&&c.dist>4);
    let want='stay';
    if(gEl>50) want='switch';
    else if(gEl>8&&oth>cur+2) want='switch';
    else if(gEl>8&&cur===0&&oth>0) want='switch';
    if(want==='switch'){
      if(dizzy&&gEl<55){ holds++;
        if(holds%20===1) logBrain('<span class="tag safe">SAFETY</span>Holding green — car approaching'); }
      else { trans=2.2; }
    }
  }
  setSig(phase, trans>0);
  /* HUD */
  document.getElementById('sDelay').textContent=(served?(delaySum/served).toFixed(1)+' s':'-');
  document.getElementById('sServed').textContent=served;
  document.getElementById('sWait').textContent=waitNow;
  document.getElementById('sSafe').textContent=holds;
  document.getElementById('sPhase').textContent=phase+(trans>0?' →':'');
  /* camera */
  camT+=dt;
  if(camMode===0){ const r=42, a=camT*0.12;
    camera.position.set(Math.cos(a)*r, 20+Math.sin(camT*0.3)*4, Math.sin(a)*r);
    camera.lookAt(0,2,0);
  } else if(camMode===1){ camera.position.set(0,85,0.1); camera.lookAt(0,0,0);
  } else { const c=cars[0]; if(c){ const A=APPR[c.a];
      camera.position.set(c.m.position.x-A.dx*9, 4.5, c.m.position.z-A.dz*9);
      camera.lookAt(c.m.position.x+A.dx*10, 2, c.m.position.z+A.dz*10); } }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
logBrain('<span class="tag ai">AI</span>SABZ brain online — watching all approaches');
tick();
</script>
</body>
</html>
